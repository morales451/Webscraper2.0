# Example ICP: dental practices that do implants / cosmetic work (high-ticket procedures).
# Edit freely, or manage profiles from the dashboard's Profiles tab.
name: Dentists offering implants
description: Independent dental practices selling high-ticket implant and cosmetic work.
queries:
- dentist
- cosmetic dentist
- dental implants
locations:
- Austin, TX
- Round Rock, TX
keywords:
- dental implant*: 3
- all-on-4: 3
- sedation: 2
- invisalign: 2
- veneers: 2
- financing
- new patient*
- emergency
required_keywords:
- implant*
exclude_keywords: []
filters:
  min_rating: 4.0
  require_website: true
  exclude_names:
  - Aspen Dental
  - Western Dental
  - Bright Now
max_results_per_search: 60
pages_per_site: 5
min_score: 30
skip_seen: true
